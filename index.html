<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sitio en Mantenimiento</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        
        .mantenimiento-contenedor {
            background: #ffffff;
            padding: 50px 40px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
            max-width: 500px;
            width: 85%;
        }

        .icono {
            font-size: 4rem;
            margin-bottom: 15px;
            animation: rotar 4s linear infinite;
            display: inline-block;
        }

        h1 {
            font-size: 2.2rem;
            margin: 0 0 15px 0;
            color: #2c3e50;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #555;
            margin: 0 0 20px 0;
        }

        .contacto {
            font-size: 0.9rem;
            color: #888;
            border-top: 1px solid #eee;
            padding-top: 20px;
            margin-top: 20px;
        }

        .contacto a {
            color: #3498db;
            text-decoration: none;
        }

        .contacto a:hover {
            text-decoration: underline;
        }

        /* Pequeña animación opcional para el icono de engranaje */
        @keyframes rotar {
            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>

    <div class="mantenimiento-contenedor">
        <div class="icono">⚙️</div>
        <h1>¡Volvemos pronto!</h1>
        <p>Estamos realizando tareas de mantenimiento para mejorar tu experiencia en nuestro sitio web.</p>
        <p>Disculpa las molestias. Estaremos de vuelta en línea lo más rápido posible.</p>
    </div>

</body>
</html>
